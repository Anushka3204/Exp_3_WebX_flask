<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Thank You, {{ name }}!</h1>
        <p>Your contact information has been received. We will get back to you soon at {{ email }}.</p>
        <!-- Pass 'name' query parameter back to the homepage -->
        <a href="{{ url_for('home', name=name) }}" class="back-home">Back to Homepage</a>
    </div>
</body>
</html>
